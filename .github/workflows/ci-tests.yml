name: Krishna Website Automated Tests & Quality Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-report:
    name: Automated Testing & HTML Quality Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Full Quality Suite & Generate Dashboard
        id: qa_suite
        run: npm run qa:report

      - name: Generate Dynamic GitHub Step Summary
        if: always()
        run: node scripts/generateGithubSummary.cjs

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krishna-website-test-report
          path: |
            test-results/
            reports/
          retention-days: 30
