name: Krishna Website Quality & CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-report:
    name: Automated Testing & HTML Quality Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Type Checking & Linting
        run: |
          npm run typecheck
          npm run lint

      - name: Execute Production Build
        run: npm run build

      - name: Run Jest Unit Tests
        run: npm run test:unit

      - name: Start Backend Server & Verify Health Check
        run: |
          npm run start &
          SERVER_PID=$!
          echo "Waiting for Krishna Neural Core server on http://localhost:3000/api/health..."
          READY=0
          for i in {1..30}; do
            if curl -s -f http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Server health check passed on attempt $i!"
              READY=1
              break
            fi
            echo -n "."
            sleep 1
          done
          if [ $READY -ne 1 ]; then
            echo "Server health check failed."
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Run Full Quality Suite & Generate Reports
        id: qa_suite
        run: npm run qa:report

      - name: Enforce Automated Quality Gate
        run: node scripts/validateQualityGate.cjs

      - name: Generate Dynamic GitHub Step Summary
        if: always()
        run: node scripts/generateGithubSummary.cjs

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krishna-qa-report
          path: |
            test-results/
            reports/
          retention-days: 30
